spring.application.name=hr-bot

# Hosting platforms (Render etc.) tell the app which port to use via PORT.
# Locally this falls back to 8080.
server.port=${PORT:8080}

# MongoDB. Locally, Spring Boot's Docker Compose support connects to the
# Docker Mongo automatically and overrides this. When hosted, set MONGODB_URI
# to your MongoDB Atlas connection string.
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/hrbot}

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=604800000

# Passwords for the demo accounts DemoDataSeeder creates on an empty database.
# Set SEED_ADMIN_PASSWORD when hosted so the admin password isn't public.
app.seed.admin-password=${SEED_ADMIN_PASSWORD:password123}
app.seed.employee-password=${SEED_EMPLOYEE_PASSWORD:password123}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

app.screening.ai.enabled=false
app.screening.ai.api-key=${ANTHROPIC_API_KEY:}
app.screening.ai.model=claude-haiku-4-5-20251001

logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR
server.error.include-stacktrace=never
